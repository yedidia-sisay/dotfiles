# Starts indexing at one
set -g base-index 1
# Enables mouse support
set -g mouse on

set-option -sa terminal-overrides ",xterm*:Tc"

set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"




# My prefix key is alt-f
set -g prefix M-f

# For easier sourcing
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Better ways to move around panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -L

# Better keybinding to make, kill, and manage panes
unbind u
bind u split-window -h -c "#{pane_current_path}"
unbind o
bind o split-window -v -c "#{pane_current_path}"
unbind x
bind x kill-pane
bind i last-pane
bind m last-window




# tmux plugin manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-resurrect'

unbind p
bind-key p run-shell "xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# plugin based configs


# Use xclip for copy-paste
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# Paste from system clipboard
bind ] run "xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer"

# Enable vi mode
setw -g mode-keys vi
set -g status-keys vi

# Vi-like key bindings for copy mode
# Enter copy mode
bind -T root 'C-w' copy-mode

# In copy mode - vi navigation
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind -T copy-mode-vi 'Space' send -X begin-selection
bind -T copy-mode-vi 'Escape' send -X clear-selection

# Navigation in copy mode (vi keys)
bind -T copy-mode-vi 'h' send -X cursor-left
bind -T copy-mode-vi 'j' send -X cursor-down
bind -T copy-mode-vi 'k' send -X cursor-up
bind -T copy-mode-vi 'l' send -X cursor-right
bind -T copy-mode-vi 'w' send -X next-word
bind -T copy-mode-vi 'b' send -X previous-word
bind -T copy-mode-vi '0' send -X start-of-line
bind -T copy-mode-vi '$' send -X end-of-line
bind -T copy-mode-vi 'G' send -X bottom-line
bind -T copy-mode-vi 'g' send -X top-line

# Search in copy mode (vi style)
bind -T copy-mode-vi '/' command-prompt -p "search down" "send -X search-forward \"%%%\""
bind -T copy-mode-vi '?' command-prompt -p "search up" "send -X search-backward \"%%%\""
bind -T copy-mode-vi 'n' send -X search-again
bind -T copy-mode-vi 'N' send -X search-reverse




set -gq allow-passthrough on
set -g visual-activity off


set -g status-justify left
set -g status-left ""
set -g status-right "#S | %H:%M"

set -g window-status-current-format "#[fg=black,bold]#W"
set -g window-status-format "#W"

# Space between window names
set -g window-status-separator "  "


# Keep at the bottom
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

