# ~/.config/kitty/kitty.conf

linux_display_server x11

# Allow input method to work properly
input-method enabled

# Font (match your Neovim font if possible)
font_family FiraCode Nerd Font
font_size 16.0


# Use FreeMono explicitly for the Ethiopic block (U+1200 - U+137F)
symbol_map U+2D80-U+2DDF,U+AB00-U+AB2F Abyssinica SIL
# symbol_map U+1200-U+137F NotoSerifEthiopic-ExtraCondensed
symbol_map U+1200-U+137F ahabesha'stypewriter
symbol_map U+12F8-U+12FE Abyssinica SIL

# Include your Catppuccin theme
#
include themes/catppuccin-latte.conf



# Cursor settings (to match your Neovim cursor attempts)
cursor_shape block
cursor_blink_interval 0

# Window settings
remember_window_size yes
initial_window_width 1200
initial_window_height 700

# Additional styling to match Neovim
window_padding_width 0
hide_window_decorations titlebar-only


cursor #000000
cursor_text_color #ffffff


